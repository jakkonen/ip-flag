<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Flag</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="heading">
          <div class="brand">My IP — VPN Location</div>
          <div class="header-meta">
            <span id="status" class="status">Checking…</span>
            <span id="checked" class="checked"></span>
          </div>
        </div>
        <button id="refresh" class="icon-button" type="button" title="Check now">↻</button>
      </header>

      <section id="warning" class="warning hidden">
        IPv4 and IPv6 are exiting through different countries.
      </section>

      <section class="addresses">
        <article id="ipv4-card" class="ip-card">
          <div class="ip-card__head">
            <span>IPv4</span>
            <img id="ipv4-flag" class="flag hidden" alt="" />
          </div>
          <div id="ipv4-country" class="country">Not available</div>
          <div class="address-row">
            <span id="ipv4-address" class="address">—</span>
            <button id="ipv4-copy" class="copy-button" type="button" disabled>Copy</button>
          </div>
          <div id="ipv4-network" class="network"></div>
        </article>

        <article id="ipv6-card" class="ip-card">
          <div class="ip-card__head">
            <span>IPv6</span>
            <img id="ipv6-flag" class="flag hidden" alt="" />
          </div>
          <div id="ipv6-country" class="country">Not available</div>
          <div class="address-row">
            <span id="ipv6-address" class="address">—</span>
            <button id="ipv6-copy" class="copy-button" type="button" disabled>Copy</button>
          </div>
          <div id="ipv6-network" class="network"></div>
        </article>
      </section>

      <footer class="footer">
        <div>
          <div class="appearance-label">Appearance</div>
          <label class="style-control">
            Flag shape
            <select id="flag-style">
              <option value="round">Round</option>
              <option value="rectangle">Rectangle</option>
            </select>
          </label>
        </div>
      </footer>
    </main>
  </body>
</html>
