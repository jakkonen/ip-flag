<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Flag</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="heading">
          <div class="brand">My IP — VPN Location</div>
          <div class="header-meta">
            <span id="status" class="status">Checking…</span>
            <span id="checked" class="checked"></span>
          </div>
        </div>
        <button id="refresh" class="icon-button" type="button" title="Check now">↻</button>
      </header>

      <section id="warning" class="warning hidden">
        IPv4 and IPv6 are exiting through different countries.
      </section>

      <section class="addresses">
        <article id="ipv4-card" class="ip-card">
          <div class="ip-card__head">
            <span>IPv4</span>
            <img id="ipv4-flag" class="flag hidden" alt="" />
          </div>
          <div id="ipv4-country" class="country">Not available</div>
          <div class="address-row">
            <span id="ipv4-address" class="address">—</span>
            <button id="ipv4-copy" class="copy-button" type="button" disabled>Copy</button>
          </div>
          <div id="ipv4-network" class="network"></div>
        </article>

        <article id="ipv6-card" class="ip-card">
          <div class="ip-card__head">
            <span>IPv6</span>
            <img id="ipv6-flag" class="flag hidden" alt="" />
          </div>
          <div id="ipv6-country" class="country">Not available</div>
          <div class="address-row">
            <span id="ipv6-address" class="address">—</span>
            <button id="ipv6-copy" class="copy-button" type="button" disabled>Copy</button>
          </div>
          <div id="ipv6-network" class="network"></div>
        </article>
      </section>

      <footer class="footer">
        <section class="settings-section">
          <div class="section-label">Appearance</div>
          <label class="style-control">
            Flag shape
            <select id="flag-style">
              <option value="round">Round</option>
              <option value="rectangle">Rectangle</option>
            </select>
          </label>
        </section>

        <details class="settings-section" open>
          <summary>Checks and notifications</summary>
          <label class="toggle-control"><input id="refresh-on-startup" type="checkbox" /> Check when browser starts</label>
          <label class="toggle-control"><input id="refresh-on-popup-open" type="checkbox" /> Refresh when popup opens</label>
          <label class="toggle-control"><input id="refresh-on-new-tab" type="checkbox" /> Refresh when a new tab opens</label>
          <label class="toggle-control"><input id="scheduled-refresh-enabled" type="checkbox" /> Check automatically</label>
          <label id="refresh-interval-control" class="style-control">
            Every
            <select id="refresh-interval">
              <option value="0.5">30 seconds</option>
              <option value="1">1 minute</option>
              <option value="5">5 minutes</option>
              <option value="15">15 minutes</option>
              <option value="30">30 minutes</option>
            </select>
          </label>
          <label class="toggle-control"><input id="notify-ip-change" type="checkbox" /> Notify when IP changes</label>
          <label class="toggle-control"><input id="notify-country-change" type="checkbox" /> Notify when country changes</label>
        </details>

        <details class="history-section" open>
          <summary>Check history</summary>
          <div id="history" class="history-empty">No completed checks yet.</div>
          <button id="clear-history" class="text-button" type="button" hidden>Clear history</button>
        </details>
      </footer>
    </main>
  </body>
</html>
